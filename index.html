<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝕃𝔼𝕆 𝕊𝕋𝕆ℝ𝔼</title>
<style>
:root{--gold:#D4A017;--gold-soft:#F0C95A;--ink:#0A0A0A;--panel:#151515;--panel-2:#1F1F1F;--line:#2C2C2C;--text:#F5EFE0;--muted:#9C978A;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--ink);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(10,10,10,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{font-size:20px;font-weight:500;color:var(--gold);letter-spacing:2px}
.search-toggle{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:0 18px 40px}
.hero{position:relative;overflow:hidden;border-radius:24px;margin:18px 0 8px;padding:34px 22px;background:var(--panel);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--gold);opacity:.14;top:-90px;left:-70px}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;border:1px solid var(--gold);opacity:.35;bottom:-40px;right:-30px}
.hero h1{position:relative;margin:0 0 8px;font-size:34px;font-weight:500;color:var(--gold);letter-spacing:3px}
.hero p{position:relative;margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.7;max-width:460px}
.hero .stats{position:relative;display:flex;gap:18px;margin-top:22px;font-size:12px;color:var(--muted)}
.hero .stats b{display:block;font-size:18px;color:var(--text);font-weight:500}
.btn{display:inline-block;position:relative;background:var(--gold);color:var(--ink);border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.search{width:100%;margin:18px 0 14px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;display:none}
.search.open{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px 0 6px;padding-bottom:4px;scrollbar-width:none}
.chip{flex-shrink:0;font-size:13px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500}
.section-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500;margin:28px 0 12px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.featured{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:16px;cursor:pointer}
.featured .meta{flex:1;min-width:0}
.featured .tag{font-size:11px;color:var(--ink);background:var(--gold);padding:3px 9px;border-radius:6px}
.featured h3{margin:8px 0 2px;font-size:19px;font-weight:500}
.featured p{margin:0;font-size:13px;color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sticker{background:var(--text);color:var(--ink);border:none;border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;font-size:14px;font-weight:500}
.sticker:nth-child(odd){transform:rotate(-2.5deg)}
.sticker:nth-child(even){transform:rotate(2deg)}
.sticker small{display:block;font-size:11px;font-weight:400;color:#555;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.app-icon{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:var(--ink)}
.card b{font-size:15px;font-weight:500}
.card span{font-size:12px;color:var(--muted)}
.card .get{margin-top:auto;font-size:13px;font-weight:500;color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:30px 0;display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:34px 0 10px;border-top:1px solid var(--line);margin-top:34px}
footer b{color:var(--gold);font-weight:500;letter-spacing:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:760px;border-radius:24px 24px 0 0;border-top:2px solid var(--gold);padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.sheet .head{display:flex;gap:14px;align-items:center}
.sheet .head .app-icon{width:70px;height:70px;font-size:28px;border-radius:20px}
.sheet h3{margin:0;font-size:20px;font-weight:500}
.sheet .meta{font-size:13px;color:var(--muted);margin-top:4px}
.sheet p.desc{font-size:14px;line-height:1.8;margin:16px 0;color:var(--text)}
.preview-label{font-size:12px;color:var(--muted)}
.preview{font-size:26px;padding:16px;border-radius:14px;background:var(--ink);border:1px solid var(--line);min-height:62px;margin:8px 0 10px;word-break:break-word;color:var(--gold-soft)}
.preview-input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--text);font-size:15px;margin-bottom:16px}
.close{float:left;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
.gallery{display:flex;gap:10px;overflow-x:auto;padding:6px 0 16px;scroll-snap-type:x mandatory}
.gallery img{height:300px;width:auto;border-radius:16px;border:1px solid var(--line);flex-shrink:0;scroll-snap-align:start}
main{perspective:1200px}
.hero{transform-style:preserve-3d;transform:rotateX(7deg);box-shadow:0 34px 60px -24px rgba(212,160,23,.4),0 12px 24px rgba(0,0,0,.7)}
.hero::before{transform:translateZ(-60px)}
.hero::after{transform:translateZ(-30px)}
.hero h1{transform:translateZ(45px);text-shadow:0 12px 26px rgba(212,160,23,.35)}
.hero p,.hero .btn,.hero .stats{transform:translateZ(22px)}
.featured{transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s;box-shadow:0 22px 40px -18px rgba(212,160,23,.5)}
.featured .app-icon{transform:translateZ(35px);box-shadow:0 14px 26px rgba(0,0,0,.7)}
.card{transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s;box-shadow:0 14px 26px -12px #000}
.card:hover{box-shadow:0 26px 44px -14px rgba(212,160,23,.35)}
.card .app-icon{transform:translateZ(30px);box-shadow:0 10px 20px rgba(0,0,0,.6)}
.album .sticker{box-shadow:0 10px 0 -2px #8a7a4a,0 20px 30px rgba(0,0,0,.6);transition:transform .25s ease}
.album .sticker:hover{transform:rotate(0) translateY(-8px) translateZ(25px)}
.btn{box-shadow:0 8px 0 #9a7410,0 14px 22px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #9a7410}
</style>
</head>

var currentCat = "الكل";
var CATS = ["الكل"].concat(APPS.map(function(a){return a.cat;}).filter(function(v,i,s){return s.indexOf(v)===i;}));

function iconHtml(a){ if(a.icon) return '<img class="app-icon" alt="" src="'+a.icon+'" style="object-fit:cover;padding:0">'; return '<div class="app-icon" style="background:'+a.color+'">'+a.letter+'</div>'; }

function renderChips(){
  document.getElementById("chips").innerHTML = CATS.map(function(c){
    return '<button class="chip'+(c===currentCat?' on':'')+'" data-cat="'+c+'">'+c+'</button>';
  }).join("");
}

function renderAlbum(){
  document.getElementById("album").innerHTML = APPS.map(function(a){
    return '<button class="sticker" data-open="'+a.id+'">'+(a.icon?'<img alt="" src="'+a.icon+'" style="width:64px;height:64px;border-radius:16px;object-fit:cover;display:block;margin:0 auto 8px">':'')+a.name+'<small>اضغط للتفاصيل</small></button>';
  }).join("");
}

function renderGrid(){
  var q = document.getElementById("search").value.trim();
  var list = APPS.filter(function(a){
    var catOk = currentCat==="الكل" || a.cat===currentCat;
    var qOk = !q || a.name.indexOf(q)>-1 || a.cat.indexOf(q)>-1;
    return catOk && qOk;
  });
  document.getElementById("grid").innerHTML = list.map(function(a){
    return '<div class="card" data-open="'+a.id+'">'+iconHtml(a)+'<div><b>'+a.name+'</b><br><span>'+a.cat+' · '+a.rating+' ★</span></div><span>'+a.downloads+' تحميل</span><span class="get">عرض التفاصيل</span></div>';
  }).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}

function openApp(id){
  var a = APPS.filter(function(x){return x.id===id;})[0];
  if(!a) return;
  document.getElementById("sheet").innerHTML =
    '<button class="close" id="closeBtn" aria-label="إغلاق">×</button>' +
    '<div class="head">'+iconHtml(a)+'<div><h3>'+a.name+'</h3><div class="meta">'+a.cat+' · الإصدار '+a.ver+' · '+a.rating+' ★ · '+a.downloads+' تحميل</div></div></div>' +
    '<p class="desc">'+a.desc+'</p>' + galleryHtml(a) +
    '<div class="preview-label">جرّب الخط</div>' +
    '<div class="preview" id="preview">'+a.sample+'</div>' +
    '<input class="preview-input" id="previewInput" value="'+a.sample+'">' +
    '<button class="btn" id="dlBtn" style="width:100%" onclick="downloadApp(\''+a.id+'\')">تحميل APK</button>' +
    '<div id="dlBar" style="display:none;margin-top:14px"><div style="height:8px;border-radius:8px;background:var(--ink);overflow:hidden"><div id="dlFill" style="height:100%;width:0;background:var(--gold);transition:width .2s"></div></div><div id="dlText" style="font-size:13px;color:var(--muted);margin-top:8px"></div></div>' +
    '<a id="installBtn" class="btn" href="#" style="width:100%;display:none;text-align:center;margin-top:12px">تثبيت التطبيق</a>';
  document.getElementById("overlay").classList.add("open");
  document.getElementById("closeBtn").onclick = closeSheet;
  document.getElementById("previewInput").oninput = function(){
    document.getElementById("preview").textContent = this.value || " ";
  };
}

function downloadApp(id){
  var a = APPS.filter(function(x){return x.id===id;})[0];
  var btn = document.getElementById("dlBtn"), bar = document.getElementById("dlBar");
  var fill = document.getElementById("dlFill"), txt = document.getElementById("dlText");
  btn.style.display = "none"; bar.style.display = "block";
  txt.textContent = "جاري التحميل...";
  fetch(a.url).then(function(res){
    if(!res.ok) throw new Error("bad response");
    var total = +res.headers.get("content-length") || 0, got = 0, chunks = [];
    var reader = res.body.getReader();
    function pump(){
      return reader.read().then(function(r){
        if(r.done) return;
        chunks.push(r.value); got += r.value.length;
        var pct = total ? Math.round(got / total * 100) : 0;
        fill.style.width = (total ? pct : 50) + "%";
        txt.textContent = total ? "جاري التحميل " + pct + "%" : "جاري التحميل...";
        return pump();
      });
    }
    return pump().then(function(){
      var blob = new Blob(chunks, {type:"application/vnd.android.package-archive"});
      var inst = document.getElementById("installBtn");
      inst.href = URL.createObjectURL(blob);
      inst.setAttribute("download", a.name + ".apk");
      fill.style.width = "100%";
      txt.textContent = "تم التحميل. اضغط تثبيت";
      inst.style.display = "block";
    });
  }).catch(function(){
    txt.textContent = "تعذر التحميل داخل الصفحة، هيتفتح الرابط مباشرة";
    btn.style.display = "block";
    window.open(a.url, "_blank");
  });
}

function galleryHtml(a){ if(!a.gallery) return ''; return '<div class="gallery">'+a.gallery.map(function(u){return '<img alt="" src="'+u+'">';}).join('')+'</div>'; }

function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }

document.addEventListener("click", function(e){
  var chip = e.target.closest("[data-cat]");
  if(chip){ currentCat = chip.getAttribute("data-cat"); renderChips(); renderGrid(); return; }
  var op = e.target.closest("[data-open]");
  if(op){ openApp(op.getAttribute("data-open")); return; }
  if(e.target.id==="overlay") closeSheet();
});

document.getElementById("search").addEventListener("input", renderGrid);
document.getElementById("searchToggle").onclick = function(){
  document.getElementById("search").classList.toggle("open");
};

document.getElementById("statApps").textContent = APPS.length;
document.addEventListener("pointermove", function(e){
  var hit = e.target.closest(".card,.featured");
  document.querySelectorAll(".card,.featured").forEach(function(el){
    if(el!==hit){ el.style.transform=""; return; }
    var r = el.getBoundingClientRect();
    var x = (e.clientX - r.left)/r.width - .5;
    var y = (e.clientY - r.top)/r.height - .5;
    el.style.transform = "perspective(700px) rotateX("+(-y*12)+"deg) rotateY("+(x*12)+"deg) translateZ(8px)";
  });
});
renderChips();
renderAlbum();
renderGrid();
</script>
